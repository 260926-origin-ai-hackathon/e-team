<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>%sveltekit.status% つぐみ</title>
		<style>
			body {
				margin: 0;
				font-family:
					system-ui,
					-apple-system,
					'Hiragino Sans',
					'Noto Sans JP',
					sans-serif;
				font-size: 18px;
				color: #1f2933;
				background: #faf8f4;
			}
			main {
				max-width: 640px;
				margin: 0 auto;
				padding: 48px 16px;
			}
			p {
				border: 1px dashed #e5e0d8;
				border-radius: 12px;
				padding: 24px;
				background: #fff;
			}
			a {
				color: #b45309;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>%sveltekit.status%</h1>
			<p>%sveltekit.error.message%</p>
			<a href="/">ロール選択へ戻る</a>
		</main>
	</body>
</html>
